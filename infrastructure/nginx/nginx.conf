##
## Viralix — production Nginx reverse proxy
## Handles: HTTPS termination, API proxying, static SPA serving,
##           SSE/WebSocket pass-through, rate limiting, security headers.
##

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ---------------------------------------------------------------------------
    # Core settings
    # ---------------------------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;

    client_max_body_size   50m;
    client_body_buffer_size 128k;

    # ---------------------------------------------------------------------------
    # Gzip compression
    # ---------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # ---------------------------------------------------------------------------
    # Rate limiting zones
    # ---------------------------------------------------------------------------
    # General API: 100 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    # Auth endpoints: stricter — 10 requests per minute
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    # SSE/streaming: 20 concurrent streams per IP
    limit_conn_zone $binary_remote_addr zone=sse_conn:10m;

    limit_req_status  429;
    limit_conn_status 429;

    # ---------------------------------------------------------------------------
    # Upstream: Node.js API
    # ---------------------------------------------------------------------------
    upstream api {
        server 127.0.0.1:8090;
        keepalive 32;
    }

    # ---------------------------------------------------------------------------
    # SSL shared settings (used in HTTPS server block)
    # ---------------------------------------------------------------------------
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;
    ssl_stapling            on;
    ssl_stapling_verify     on;

    # ---------------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------------------
    # HTTPS — main server
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name viralix.ai www.viralix.ai;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

        root  /var/www/html;
        index index.html;

        # ---------------------------------------------------------------------------
        # Security headers
        # ---------------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; "
            "script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.googletagmanager.com; "
            "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
            "font-src 'self' https://fonts.gstatic.com; "
            "img-src 'self' data: blob: https:; "
            "connect-src 'self' https://api.stripe.com wss: ws:; "
            "frame-src https://js.stripe.com; "
            "object-src 'none'; "
            "base-uri 'self';"
            always;

        # ---------------------------------------------------------------------------
        # API proxy — /api/*
        # ---------------------------------------------------------------------------
        location /api/ {
            # Rate limiting — burst allows short spikes, nodelay rejects excess immediately
            limit_req zone=api_limit burst=30 nodelay;
            limit_conn sse_conn 20;

            proxy_pass         http://api;
            proxy_http_version 1.1;

            # Required for SSE (server-sent events) and WebSocket upgrade
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $http_connection;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # SSE-friendly timeouts (long-lived connections)
            proxy_read_timeout         300s;
            proxy_send_timeout         300s;
            proxy_connect_timeout      10s;

            # Disable buffering for SSE streams
            proxy_buffering            off;
            proxy_cache                off;

            # Pass keepalive
            proxy_set_header           Connection "";
        }

        # Stricter rate-limiting for auth routes
        location ~ ^/api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            proxy_connect_timeout 10s;
        }

        # ---------------------------------------------------------------------------
        # Static frontend assets — aggressive cache for hashed filenames
        # ---------------------------------------------------------------------------
        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|webp|avif|gif|mp4|webm)$ {
            expires        1y;
            add_header     Cache-Control "public, max-age=31536000, immutable";
            access_log     off;
            try_files      $uri =404;
        }

        # ---------------------------------------------------------------------------
        # SPA fallback — all unmatched routes serve index.html
        # ---------------------------------------------------------------------------
        location / {
            # index.html must never be cached by the browser
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";

            try_files $uri $uri/ /index.html;
        }

        # ---------------------------------------------------------------------------
        # Deny hidden files (.env, .git, etc.)
        # ---------------------------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ---------------------------------------------------------------------------
        # Health check endpoint (bypass rate limiting)
        # ---------------------------------------------------------------------------
        location = /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
